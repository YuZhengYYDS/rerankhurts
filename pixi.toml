[workspace]
name = "rerankhuts"
version = "0.2.0"
description = "Reproducible source-retention and fact-coverage auditing for RAG"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]
requires-pixi = ">=0.81.0"

[dependencies]
python = "3.11.*"
pip = "*"

[pypi-dependencies]
numpy = "==2.2.6"
pandas = "==2.3.3"
matplotlib = "==3.10.7"
scikit-learn = "==1.7.2"
pytest = "==8.4.2"
pypdf = "==6.1.1"
requests = "==2.32.5"
python-dotenv = "==1.1.1"
beautifulsoup4 = "==4.14.2"
lxml = "==6.0.2"
tqdm = "==4.67.1"
openai = ">=1.0,<3"

[activation.env]
PYTHONUTF8 = "1"
PYTHONHASHSEED = "20260924"
TOKENIZERS_PARALLELISM = "false"
HF_HUB_DISABLE_SYMLINKS_WARNING = "1"

[feature.gpu.pypi-dependencies]
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" }
sentence-transformers = "==5.1.2"
transformers = "==4.57.1"

[feature.paper.dependencies]
tectonic = "==0.15.0"

[environments]
default = { features = [], solve-group = "base" }
gpu = { features = ["gpu"], solve-group = "base" }
paper = { features = ["paper"], solve-group = "base" }

[tasks]
workflow = "python -m rerankhuts"
status = "python -m rerankhuts status"
verify = "python -m rerankhuts verify"
test = "python -m rerankhuts test"
paper = "python -m rerankhuts paper"
paper-tables = "python -m rerankhuts tables"
package = "python -m rerankhuts package"
verify-package = "python -m rerankhuts verify-package"
e0 = "python -m rerankhuts e0"
verify-e3 = "python validation/check_e3.py --run experiments/runs/e3_m3 --output build/verification/e3"
analyze-e3 = "python -m rerankhuts analyze-e3"
interactions-e3 = "python -m rerankhuts interactions-e3"
sim-generate = "python -m rerankhuts sim-generate"
sim-run = "python -m rerankhuts sim-run"
sim-evaluate = "python -m rerankhuts sim-evaluate"
e3 = "python -m rerankhuts e3"
strengthen-models = "python -m rerankhuts strengthen-models"
strengthen-generate = "python -m rerankhuts strengthen-generate"
strengthen-audit = "python -m rerankhuts strengthen-audit"
strengthen-run = "python -m rerankhuts strengthen-run"
strengthen-evaluate = "python -m rerankhuts strengthen-evaluate"
strengthen-analyze = "python -m rerankhuts strengthen-analyze"
strengthen-answers = "python -m rerankhuts strengthen-answers"
strengthen-timing = "python -m rerankhuts strengthen-timing"
strengthen-verify = "python -m rerankhuts strengthen-verify"
legacy-normalize = "python -m rerankhuts legacy-normalize"
legacy-eval = "python -m rerankhuts legacy-eval"
legacy-score = "python -m rerankhuts legacy-score"
legacy-analysis = "python -m rerankhuts legacy-analysis"
legacy-summarize = "python -m rerankhuts legacy-summarize"

stage-reanalysis = "python -m rerankhuts stage-reanalysis"
packing-reanalysis = "python -m rerankhuts packing-reanalysis"
oncology-coverage = "python -m rerankhuts oncology-coverage"
